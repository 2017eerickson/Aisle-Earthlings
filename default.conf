server {
    listen 80;
    listen [::]:80;
    server_name aisleearthlings.com www.aisleearthlings.com;

    return 301 https://aisleearthlings.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aisleearthlings.com www.aisleearthlings.com;

    ssl_certificate /etc/letsencrypt/live/aisleearthlings.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aisleearthlings.com/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}