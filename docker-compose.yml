services:
  db:
    image: postgres:15
    container_name: AE-postgres-container
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - ./postgres_data/:/var/lib/postgresql/data/
  redis:
    image: redis:7
    container_name: AE-redis-container

  backend:
    build: ./server
    container_name: AE-django-container
    env_file:
      - .env
    command: sh -c "gunicorn aisle_earthlings.wsgi --bind 0.0.0.0:8000 --reload"
    ports:
      - "8001:8000"
    volumes:
      - ./server:/app
    depends_on:
      - db
    # - redis

  frontend:
    image: client-img
    build: ./client
    container_name: AE-client-container
    ports:
      - "80:80"
      - "443:443"
    volumes:
        # - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        # - ./client/dist:/usr/share/nginx/html
      - ./client/dist:/usr/share/nginx/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
