services:
  db:
    ports: !override []

  backend:
    command: sh -c "gunicorn aisle_earthlings.wsgi --bind 0.0.0.0:8000"
    ports: !override []
    volumes: !override []

  frontend:
    volumes:
      - ./client/dist:/usr/share/nginx/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
